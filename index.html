/* ===== 見た目（デザイン）の設定 ===== */
:root{
  --active-bg:linear-gradient(135deg,#4f6df0,#d64a93);
  --accent-waterfall:linear-gradient(135deg,#0284c7,#06b6d4);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
/* 夜モードの色 */
body[data-theme="night"]{
  --text:#ffffff; --glass:rgba(16,22,46,.78); --glass-line:rgba(255,255,255,.26);
  --panel:rgba(14,19,42,.96); --seg-bg:rgba(255,255,255,.12);
  --bar-bg:rgba(12,16,36,.92); --bar-item:rgba(255,255,255,.10); --card-bg:rgba(18,24,50,.95);
  --start-bg:radial-gradient(circle at 20% 15%,rgba(124,156,255,.5),transparent 45%),radial-gradient(circle at 85% 80%,rgba(255,122,182,.4),transparent 45%),linear-gradient(160deg,#0d1226,#1b1440);
}
/* 昼モードの色 */
body[data-theme="day"]{
  --text:#1a2040; --glass:rgba(255,255,255,.88); --glass-line:rgba(26,32,64,.16);
  --panel:rgba(255,255,255,.97); --seg-bg:rgba(26,32,64,.08);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:var(--text);

}
a-scene{position:fixed!important;inset:0;z-index:1;}
a-scene .a-canvas{background:transparent!important;}
.a-enter-vr,.a-enter-ar,.a-enter-vr-button,.a-enter-ar-button{display:none!important;}
#camVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;background:#000;}
body[data-theme="night"] #camVideo{filter:brightness(.65) saturate(.92) contrast(1.05);}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:var(--text);}
#ui .ui-part,#tapLayer{pointer-events:auto;}
#tapLayer{position:absolute;inset:0;}

.glass{
  background:var(--glass);border:1px solid var(--glass-line);color:var(--text);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.25);
}
.hud{display:none;}
body.running .hud{display:flex;}
.camonly{display:none;}
body.mode-camera.running .camonly{display:flex;}
.camonly-block{display:none;}
body.mode-camera.running .camonly-block{display:block;}

/* 左上：いまのモードと理由 */
#modeBadge{
  position:absolute;z-index:55;top:calc(var(--safe-t) + 10px);left:calc(var(--safe-l) + 10px);
  max-width:calc(100vw - 170px);
  padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:11.5px;line-height:1.4;
}
#modeName{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;}
#modeName::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;}
#modeReason{opacity:.88;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* 右上エリア：トップ画面に「再配置ボタン」＋「メニューボタン」を配置 */
#topRightActions{

#zoomPanel{

  display:flex;align-items:center;justify-content:center;cursor:pointer;
}

.zoom-btn:active{transform:scale(.93);}

#errBar{

}

  opacity:0;pointer-events:none!important;transition:opacity .3s,transform .3s;

/* 左下：アナログスティック */
#stick{
  position:absolute;left:calc(var(--safe-l) + 18px);bottom:calc(var(--safe-b) + 94px);
  width:116px;height:116px;border-radius:50%;
  display:none;touch-action:none;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.3);
}
body.stick-on.running #stick{display:block;}
#stickKnob{
  position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:var(--active-bg);box-shadow:0 4px 14px rgba(0,0,0,.4);
}

/* 下：レイアウト切りかえ */
#layoutBar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px);
  width:min(94vw,430px);padding:6px;gap:6px;border-radius:22px;
  background:var(--bar-bg);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(0,0,0,.35);
}
#layoutBar button{
  flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:inherit;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--text);
  background:var(--bar-item);border:0;border-radius:16px;padding:6px 4px;cursor:pointer;transition:background .25s,transform .1s;
}
#layoutBar button:active{transform:scale(.96);}
#layoutBar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
#layoutBar button.active{background:var(--active-bg);color:#fff;box-shadow:0 4px 14px rgba(79,109,240,.5);}

/* ===== 横画面（Landscape）自動最適化 ===== */
body.is-landscape #modeBadge{max-width:340px;}
body.is-landscape #layoutBar{width:min(54vw,380px);bottom:calc(var(--safe-b) + 8px);}
body.is-landscape #layoutBar button{min-height:44px;flex-direction:row;gap:6px;font-size:12.5px;}
body.is-landscape #stick{bottom:calc(var(--safe-b) + 14px);width:104px;height:104px;}
body.is-landscape #zoomPanel{bottom:calc(var(--safe-b) + 14px);}
body.is-landscape .zoom-btns{flex-direction:row;}
body.is-landscape #toast{bottom:calc(var(--safe-b) + 70px);}

/* ハンバーガーメニュー本体 */
#menu{position:absolute;inset:0;z-index:65;visibility:hidden;transition:visibility 0s linear .3s;}
#menu.open{visibility:visible;transition-delay:0s;}
.menu-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s;}
#menu.open .menu-backdrop{opacity:1;}
.menu-panel{
  position:absolute;top:0;right:0;bottom:0;width:min(88vw,360px);overflow-y:auto;touch-action:pan-y;
  padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px);
  background:var(--panel);color:var(--text);border-left:1px solid var(--glass-line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateX(100%);transition:transform .3s ease;box-shadow:-10px 0 30px rgba(0,0,0,.3);
}
#menu.open .menu-panel{transform:none;}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.menu-head h2{margin:0;font-size:20px;font-weight:900;}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;font:inherit;font-size:18px;color:var(--text);background:var(--seg-bg);cursor:pointer;}
.menu-sec{padding:13px 0;border-bottom:1px solid var(--glass-line);}
.menu-sec:last-child{border-bottom:0;}
.menu-sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;opacity:.75;font-weight:700;}
.menu-sec p{margin:0;font-size:13px;line-height:1.7;opacity:.92;}
.seg{display:flex;background:var(--seg-bg);border-radius:14px;padding:3px;gap:2px;}
.seg button{
  flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:13.5px;font-weight:700;
  padding:9px 8px;border-radius:11px;cursor:pointer;
}
.seg button.on{background:var(--active-bg);color:#fff;}
.menu-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;
  border:1px solid var(--glass-line);background:var(--seg-bg);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer;
}
.menu-btn:active{transform:scale(.98);}
.menu-btn.primary,.menu-btn[aria-pressed="true"]{background:var(--active-bg);color:#fff;border-color:transparent;}
.menu-btn.map-btn{background:#10b981;color:#fff;border-color:transparent;text-decoration:none;margin-bottom:8px;}
.menu-btn.waterfall-btn{background:var(--accent-waterfall);color:#fff;border-color:transparent;margin-bottom:8px;}
.row{display:flex;gap:10px;align-items:center;}
.row .menu-btn{width:auto;flex:none;min-width:92px;}
#bgmVol{flex:1;min-width:0;accent-color:#6c8cff;touch-action:pan-x;height:32px;}

/* ポスター・見どころをタップしたときのカード */
#card{
  position:absolute;inset:0;z-index:62;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,10,24,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#card.show{display:flex;animation:fadeIn .25s ease;}
.card-inner{
  width:100%;max-width:460px;max-height:calc(100% - 20px);overflow-y:auto;touch-action:pan-y;
  padding:16px;border-radius:26px;background:var(--card-bg);color:var(--text);
}
body.is-landscape .card-inner{max-width:620px;display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:start;}
body.is-landscape #cardImg{max-height:68vh;}
#cardImg{width:100%;max-height:38vh;object-fit:contain;border-radius:14px;background:#fff;display:block;}
.card-no{display:inline-block;margin:10px 0 4px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--active-bg);color:#fff;}
#cardTitle{margin:2px 0 4px;font-size:21px;font-weight:900;line-height:1.3;}
#cardSpot{margin:0 0 10px;font-size:13.5px;font-weight:700;opacity:.9;display:flex;align-items:center;gap:4px;}
#cardDesc{margin:0 0 14px;font-size:14px;line-height:1.7;}
.card-scale-row{display:flex;gap:8px;margin-bottom:8px;}
.card-scale-row button{flex:1;padding:10px;font-size:13px;}

/* スタート画面 */
#start{
  position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--safe-t) + 74px) 16px calc(var(--safe-b) + 24px);
  text-align:center;background:var(--start-bg);color:var(--text);overflow-y:auto;touch-action:pan-y;
}
#start.hide{display:none;}
.start-card{width:100%;max-width:460px;padding:22px 20px;border-radius:28px;margin:auto 0;}
body.is-landscape .start-card{max-width:720px;padding:18px 22px;}
.start-opts{display:flex;gap:8px;margin-bottom:12px;}
.start-opts .seg{flex:1;}
.space-select-box{margin-bottom:14px;text-align:left;}
.space-select-label{font-size:11.5px;font-weight:800;opacity:.8;margin-bottom:5px;display:block;}
.start-tag{display:inline-block;font-size:11px;letter-spacing:.14em;padding:4px 12px;border-radius:99px;background:var(--seg-bg);}
#startTitle{margin:10px 0 4px;font-size:24px;line-height:1.3;font-weight:900;}
#startSub{margin:0 0 14px;font-size:13.5px;opacity:.85;}
.start-list{margin:0 0 16px;padding:0;list-style:none;font-size:12.5px;line-height:1.65;text-align:left;opacity:.95;}
.start-list li{padding-left:1.3em;position:relative;margin-bottom:3px;}
.start-list li::before{content:'●';position:absolute;left:0;color:#d64a93;font-size:9px;top:.25em;}

/* スタート画面内の3Dオブジェクト解説セクション */
.obj-guide{
  margin:0 0 16px;text-align:left;background:var(--seg-bg);border-radius:16px;padding:10px 12px;
  border:1px solid var(--glass-line);
}
.obj-guide-toggle{
  width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0;
}
.obj-guide-list{
  margin-top:10px;max-height:175px;overflow-y:auto;display:grid;gap:8px;padding-right:4px;
}
.obj-guide-list.collapsed{display:none;}
.obj-guide-item{
  background:var(--card-bg);padding:9px 11px;border-radius:12px;font-size:12px;line-height:1.5;
  border:1px solid var(--glass-line);
}
.obj-guide-item strong{display:block;font-size:13px;margin-bottom:2px;color:#6c8cff;}
body[data-theme="day"] .obj-guide-item strong{color:#3b5bdb;}

#startBtn{
  width:100%;font:inherit;font-size:17px;font-weight:900;color:#fff;border:0;border-radius:18px;padding:15px;cursor:pointer;
  background:var(--active-bg);box-shadow:0 10px 28px rgba(79,109,240,.45);
}
#startBtn:disabled{opacity:.65;}
#startBtn:active{transform:scale(.98);}
.diag{margin-top:12px;font-size:11.5px;line-height:1.6;opacity:.82;max-width:460px;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>

async function checkAR() {
  if (isIOS) return { ok: false, short: 'short.ios', why: 'why.ios', p: {} };
  if (!isAndroid) return { ok: false, short: 'short.notAndroid', why: 'why.notAndroid', p: {} };
  if (!isChrome) return { ok: false, short: 'short.notChrome', why: 'why.notChrome', p: {} };
  if (!navigator.xr) return { ok: false, short: 'short.noXR', why: 'why.noXR', p: {} };
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-ar');
    return ok ? { ok: true, short: 'short.ok', why: 'why.arOk', p: {} }
              : { ok: false, short: 'short.noARCore', why: 'why.noARCore', p: {} };
  } catch (e) {
    return { ok: false, short: 'short.checkErr', why: 'why.checkErr', p: { name: (e && e.name) || 'Error' } };
  }
}

function loadImage(path) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('not found: ' + path));
    img.src = path;
  });
}
function fitImageToDataURL(img) {
  const W = 800, H = 1131, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const s = Math.min(W / img.naturalWidth, H / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  return c.toDataURL('image/jpeg', 0.9);
}
function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  return withTimeout(document.fonts.load('900 40px "Noto Sans JP"', 'あ'), 2500).catch(() => {});
}
function roundRectPath(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrapLines(g, text, maxW) {
  const lines = []; let cur = '';
  for (const ch of String(text)) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    const tt = cur + ch;
    if (g.measureText(tt).width > maxW && cur) { lines.push(cur); cur = ch; } else cur = tt;
  }
  if (cur) lines.push(cur);
  return lines;
}
function makePlaceholderDataURL(i, title, spot) {
  const W = 800, H = 1131, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const hue = (i * 52 + 200) % 360;
  const grad = g.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, 'hsl(' + hue + ',78%,58%)');
  grad.addColorStop(1, 'hsl(' + ((hue + 55) % 360) + ',82%,40%)');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.18; g.fillStyle = '#fff';
  g.beginPath(); g.arc(W * 0.85, H * 0.12, 230, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(W * 0.1, H * 0.9, 300, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(255,255,255,.92)'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.font = '900 140px "Noto Sans JP",sans-serif';
  g.fillText(String(i + 1).padStart(2, '0'), 60, 195);
  g.fillStyle = 'rgba(255,255,255,.94)'; roundRectPath(g, 50, 310, W - 100, 480, 36); g.fill();
  g.fillStyle = '#1d2340'; g.textAlign = 'center';
  let size = 90, lines = [];
  for (; size >= 42; size -= 6) {
    g.font = '900 ' + size + 'px "Noto Sans JP",sans-serif';
    lines = wrapLines(g, title || '', W - 180);
    if (lines.length * size * 1.3 <= 400) break;
  }
  const blockH = lines.length * size * 1.3;
  lines.forEach((ln, k) => g.fillText(ln, W / 2, 310 + (480 - blockH) / 2 + size * 1.02 + k * size * 1.3));
  g.fillStyle = '#fff'; g.font = '700 34px "Noto Sans JP",sans-serif';
  const spotLines = wrapLines(g, '📍 ' + (spot || ''), W - 120);
  spotLines.slice(0, 2).forEach((ln, k) => g.fillText(ln, W / 2, 880 + k * 46));
  g.globalAlpha = 0.85; g.font = '500 26px "Noto Sans JP",sans-serif';
  g.fillText('Tap to Zoom / Google Maps', W / 2, 1045);
  return c.toDataURL('image/png');
}
async function loadPosterTexture(i, d) {
  if (d.image) {
    try {
      const img = await withTimeout(loadImage(d.image), 6000);
      try { return { src: fitImageToDataURL(img), placeholder: false }; } catch (e) { return { src: d.image, placeholder: false }; }
    } catch (e) {}

  await fontsReady();

}

function geometryFor(shape, s) {
  const r = s / 2;
  switch (shape) {
    case 'box':          return { primitive: 'box', width: s * 0.85, height: s * 0.85, depth: s * 0.85 };
    case 'torus':        return { primitive: 'torus', radius: r * 0.72, radiusTubular: r * 0.28, segmentsRadial: 16, segmentsTubular: 40 };
    case 'torusKnot':    return { primitive: 'torusKnot', radius: r * 0.65, radiusTubular: r * 0.2, segmentsRadial: 12, segmentsTubular: 80, p: 2, q: 3 };
    case 'icosahedron':  return { primitive: 'icosahedron', radius: r };
    case 'octahedron':   return { primitive: 'octahedron', radius: r };
    case 'dodecahedron': return { primitive: 'dodecahedron', radius: r };
    case 'tetrahedron':  return { primitive: 'tetrahedron', radius: r };
    case 'cone':         return { primitive: 'cone', radiusBottom: r * 0.8, radiusTop: 0, height: s };
    case 'cylinder':     return { primitive: 'cylinder', radius: r * 0.6, height: s * 0.9 };
    default:             return { primitive: 'sphere', radius: r, segmentsWidth: 32, segmentsHeight: 24 };
  }
}
function materialFor(style, color) {
  if (style === 'wire')  return { shader: 'flat', color: color, wireframe: true };
  if (style === 'glass') return { shader: 'standard', color: color, opacity: 0.45, transparent: true, metalness: 0.1, roughness: 0.05, side: 'double' };
  return { shader: 'standard', color: color, metalness: 0.35, roughness: 0.18 };
}

/* ============================================================
   5.5 実物大の藤本滝（高さ約15m・幅約10m）を空間に生成する機能
   ============================================================ */
const fullWaterfall = (function () {
  const root = mk();
  root.setAttribute('visible', 'false');
  galleryEl.appendChild(root);

  const grp = new THREE.Group();
  const H = 15.0; // 実物大の高さ 15メートル
  const W = 10.0; // 幅 10メートル

  // 1. 滝壺（直径12m）
  const basin = new THREE.Mesh(
    new THREE.CylinderGeometry(6.2, 6.5, 0.25, 48),
    new THREE.MeshStandardMaterial({ color: '#0ea5e9', transparent: true, opacity: 0.78, roughness: 0.2 })
  );
  basin.position.set(0, 0.1, 1.5);
  grp.add(basin);

  // 2. 背後の岩壁（高さ15.5m）
  const cliffMat = new THREE.MeshStandardMaterial({ color: '#44403c', roughness: 0.92 });
  for (let i = -3; i <= 3; i++) {
    const rw = 2.2 + (Math.abs(i) % 2) * 0.6;
    const rh = H + 0.5 - Math.abs(i) * 0.4;
    const rock = new THREE.Mesh(new THREE.BoxGeometry(rw, rh, 2.4), cliffMat);
    rock.position.set(i * 1.65, rh / 2, -1.2 - (Math.abs(i) % 2) * 0.35);
    rock.rotation.y = (i * 0.08);
    grp.add(rock);
  }

  // 3. 左右と頂上の緑の樹冠
  const leafMat = new THREE.MeshStandardMaterial({ color: '#15803d', roughness: 0.8 });
  const leafPositions = [
    [-5.5, 14.5, -0.8, 2.6], [-3.2, 15.2, -0.9, 2.4], [3.2, 15.2, -0.9, 2.4], [5.5, 14.5, -0.8, 2.6],
    [-6.0, 9.0, -0.5, 2.3], [6.0, 9.0, -0.5, 2.3], [-5.8, 4.0, 0.2, 2.2], [5.8, 4.0, 0.2, 2.2]
  ];
  leafPositions.forEach((lp) => {
    const tree = new THREE.Mesh(new THREE.SphereGeometry(lp[3], 14, 12), leafMat);
    tree.position.set(lp[0], lp[1], lp[2]);
    grp.add(tree);
  });

  // 4. 流れ落ちる滝の水流（テクスチャをスクロールさせてリアルな流れを表現）
  const wc = document.createElement('canvas');
  wc.width = 256; wc.height = 512;
  const wg = wc.getContext('2d');
  const wGrad = wg.createLinearGradient(0, 0, 256, 0);
  wGrad.addColorStop(0, 'rgba(186,230,253,0.4)');
  wGrad.addColorStop(0.2, 'rgba(255,255,255,0.95)');
  wGrad.addColorStop(0.5, 'rgba(125,211,252,0.9)');
  wGrad.addColorStop(0.8, 'rgba(255,255,255,0.95)');
  wGrad.addColorStop(1, 'rgba(186,230,253,0.4)');
  wg.fillStyle = wGrad;
  wg.fillRect(0, 0, 256, 512);
  // 白い筋（水しぶき線）
  wg.fillStyle = 'rgba(255,255,255,0.85)';
  for (let k = 0; k < 90; k++) {
    const sx = (k * 37) % 246;
    const sy = (k * 73) % 460;
    wg.fillRect(sx, sy, 3 + (k % 5), 25 + (k % 45));
  }
  const waterTex = new THREE.CanvasTexture(wc);
  waterTex.wrapS = THREE.RepeatWrapping;
  waterTex.wrapT = THREE.RepeatWrapping;
  waterTex.repeat.set(2, 3);

  const waterMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(4.4, H),
    new THREE.MeshBasicMaterial({ map: waterTex, transparent: true, opacity: 0.92, side: THREE.DoubleSide })
  );
  waterMesh.position.set(0, H / 2, 0.15);
  grp.add(waterMesh);

  // 5. 滝壺で跳ねる水しぶきパーティクル
  const sprayCount = 160;
  const sprayPos = new Float32Array(sprayCount * 3);
  const sprayVel = [];
  for (let i = 0; i < sprayCount; i++) {
    sprayPos[i * 3]     = (Math.random() - 0.5) * 5.2;
    sprayPos[i * 3 + 1] = Math.random() * 2.5;
    sprayPos[i * 3 + 2] = 0.2 + Math.random() * 2.2;
    sprayVel.push({ vy: 1.5 + Math.random() * 2.8, phase: Math.random() * Math.PI * 2 });
  }
  const sprayGeo = new THREE.BufferGeometry();
  sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
  const sprayMat = new THREE.PointsMaterial({ color: '#ffffff', size: 0.28, transparent: true, opacity: 0.85 });
  const sprayPts = new THREE.Points(sprayGeo, sprayMat);
  grp.add(sprayPts);

  root.setObject3D('mesh', grp);

  return {
    show() {
      // カメラの正面 9m 先に実物大の滝を配置
      const h = getHeading().clone();
      getCameraWorldPos(_p);
      // galleryEl のローカル座標に変換して配置
      const worldTarget = new THREE.Vector3(_p.x + h.x * 9.0, 0, _p.z + h.z * 9.0);
      galleryEl.object3D.worldToLocal(worldTarget);
      root.object3D.position.set(worldTarget.x, 0, worldTarget.z);
      const localLook = new THREE.Vector3(_p.x, 0, _p.z);
      galleryEl.object3D.worldToLocal(localLook);
      root.object3D.rotation.set(0, Math.atan2(localLook.x - worldTarget.x, localLook.z - worldTarget.z), 0);

      root.setAttribute('visible', 'true');
      state.fullWaterfallOn = true;
      $('#waterfallBanner').classList.add('show');
      showToast(t('toast.waterfallOn'), 6500);
    },
    hide() {
      root.setAttribute('visible', 'false');
      state.fullWaterfallOn = false;
      $('#waterfallBanner').classList.remove('show');
      showToast(t('toast.waterfallOff'), 3000);
    },
    tick(dt, T) {
      if (!state.fullWaterfallOn) return;
      waterTex.offset.y += dt * 1.8; // 水が上から下へ高速で流れ落ちるアニメーション
      const arr = sprayGeo.attributes.position.array;
      for (let i = 0; i < sprayCount; i++) {
        const v = sprayVel[i];
        arr[i * 3 + 1] = ((T * v.vy + v.phase) % 2.6);
      }
      sprayGeo.attributes.position.needsUpdate = true;
    }
  };
})();

function createPosterUnit(i, data) {
  const outer = mk(), bob = mk(), frame = mk(), plane = mk(), eyeHolder = mk(), eyeSpin = mk();
  frame.setAttribute('geometry', { primitive: 'box', width: BASE_POSTER_W + 0.14, height: BASE_POSTER_H + 0.14, depth: 0.06 });
  frame.setAttribute('material', { shader: 'standard', color: '#ffffff', roughness: 0.55, metalness: 0.05 });
  plane.setAttribute('geometry', { primitive: 'plane', width: BASE_POSTER_W, height: BASE_POSTER_H });
  plane.setAttribute('position', { x: 0, y: 0, z: 0.032 });
  plane.setAttribute('material', { shader: 'flat', color: '#e8ebf5' });

  eyeHolder.setAttribute('position', { x: 0, y: BASE_POSTER_H / 2 + 0.45, z: 0 });
  const eyeColor = hslToHex((i * 52 + 210) % 360, 85, 62);
  eyeSpin.setAttribute('geometry', geometryFor(EYECATCHES[i % EYECATCHES.length], 0.36));
  eyeSpin.setAttribute('material', materialFor('glossy', eyeColor));
  eyeHolder.appendChild(eyeSpin);

  bob.appendChild(frame);
  bob.appendChild(plane);
  bob.appendChild(eyeHolder);

  // 藤本滝ポスターの場合、ポスターの右下に3Dの「実物大の滝を見る」ボタンを配置
  let wfTrigger = null;
  if (data.hasFullWaterfall) {
    wfTrigger = mk();
    wfTrigger.setAttribute('position', { x: 0, y: -BASE_POSTER_H / 2 - 0.24, z: 0.08 });
    wfTrigger.setObject3D('mesh', createWaterfallTriggerMesh());
    bob.appendChild(wfTrigger);
  }

  outer.appendChild(bob);
  galleryEl.appendChild(outer);

  const u = {
    i: i, data: data, outer: outer, bob: bob, frame: frame, plane: plane, eyeSpin: eyeSpin, eyeColor: eyeColor,
    wfTrigger: wfTrigger,
    userScale: 1.0, // 個別の拡大・縮小倍率（0.6 〜 2.2）
    cardSrc: '', placeholder: false, phase: i * 1.7, delay: 0.12 * i,
    cur: { x: 0, y: POSTER_Y, z: 0, yaw: 0 }, tg: { x: 0, y: POSTER_Y, z: 0, yaw: 0 }
  };
  loadPosterTexture(i, data).then((res) => {
    plane.setAttribute('material', { src: res.src, shader: 'flat' });
    u.cardSrc = res.src; u.placeholder = res.placeholder;
  });
  return u;
}

function createBasicFloater(idx, f) {
  const size = clamp(Number(f.size) || 1, 0.6, 1.4);
  const outer = mk(), inner = mk();
  inner.setAttribute('geometry', geometryFor(f.shape, size));
  inner.setAttribute('material', materialFor(f.style, f.color || '#ffffff'));
  outer.appendChild(inner); galleryEl.appendChild(outer);
  const rnd = mulberry32(100 + idx * 31);
  return {
    kind: 'basic', idx: idx, size: size, style: f.style, color: f.color || '#ffffff', outer: outer, inner: inner,
    spin: 0.18 + rnd() * 0.3, bobAmp: 0.08 + rnd() * 0.1, bobFreq: 0.5 + rnd() * 0.5, phase: rnd() * 6.28,

}

function createSpotFloater(idx, f) {
  const build = MODEL_BUILDERS[f.model];
  if (!build || !LOCAL_SPOTS[f.model]) return null;
  const size = clamp(Number(f.size) || 1, 0.6, 1.4);
  const raw = build();
  raw.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(raw), sz = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  raw.position.sub(ctr);
  const wrapper = new THREE.Group(); wrapper.add(raw);
  wrapper.scale.setScalar(size / Math.max(sz.x, sz.y, sz.z, 0.001));
  const outer = mk(), inner = mk();
  inner.setObject3D('model', wrapper);
  outer.appendChild(inner); galleryEl.appendChild(outer);
  const rnd = mulberry32(500 + idx * 17);
  return {
    kind: 'spot', idx: idx, model: f.model, size: size, outer: outer, inner: inner, wrapper: wrapper,
    spin: 0.2 + rnd() * 0.25, bobAmp: 0.07 + rnd() * 0.08, bobFreq: 0.5 + rnd() * 0.5, phase: rnd() * 6.28,
    delay: 0.4 + 0.08 * idx, cur: { x: 0, y: 2, z: 0 }, tg: { x: 0, y: 2, z: 0 }
  };
}
